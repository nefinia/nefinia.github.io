name: MoC7 programme watch
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: moc7-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q beautifulsoup4
      - id: w
        run: python .github/moc7-watch/watch.py
      - name: Save snapshot
        run: |
          git config user.name "moc7-watch"
          git config user.email "actions@users.noreply.github.com"
          git add .github/moc7-watch/snapshot.json
          git diff --cached --quiet || (git commit -m "MoC7 programme snapshot [skip ci]" && git push)
      - name: Open an issue (GitHub emails you)
        if: steps.w.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "MoC7 programme changed $(date -u +'%a %d %b %H:%M UTC')" --body-file .github/moc7-watch/changes.md --assignee nefinia
