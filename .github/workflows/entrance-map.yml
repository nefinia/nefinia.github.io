name: Entrance map (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Draw the map around the entrance from OpenStreetMap tiles
        run: |
          python3 - <<'PY'
          import math, io, urllib.request
          from PIL import Image, ImageDraw
          lat, lon, z = 55.700659, 12.560836, 17
          n = 2 ** z
          xt = (lon + 180) / 360 * n
          yt = (1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * n
          W, H = 720, 420  # output, drawn at 2x for sharp phones
          px, py = xt * 256, yt * 256
          x0, y0 = px - W / 2, py - H / 2
          img = Image.new("RGB", (W, H), "white")
          for tx in range(int(x0 // 256), int((x0 + W) // 256) + 1):
              for ty in range(int(y0 // 256), int((y0 + H) // 256) + 1):
                  url = f"https://tile.openstreetmap.org/{z}/{tx}/{ty}.png"
                  req = urllib.request.Request(url, headers={"User-Agent": "MoC7 Atlas static entrance map (sofiagallego.com/moc7)"})
                  t = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=30).read())).convert("RGB")
                  img.paste(t, (int(tx * 256 - x0), int(ty * 256 - y0)))
          d = ImageDraw.Draw(img)
          cx, cy = W // 2, H // 2
          d.ellipse([cx - 22, cy - 22, cx + 22, cy + 22], fill=(43, 34, 87, 60), outline=(43, 34, 87), width=3)
          d.ellipse([cx - 9, cy - 9, cx + 9, cy + 9], fill=(214, 72, 52), outline="white", width=3)
          img = img.resize((W, H))
          img.save("moc7/entrance-map.png", optimize=True)
          print("saved", img.size)
          PY
      - run: |
          git config user.name "moc7-watch"; git config user.email "actions@users.noreply.github.com"
          git add moc7/entrance-map.png && git commit -m "MoC7 Atlas: entrance map image (© OpenStreetMap contributors)" && git push
