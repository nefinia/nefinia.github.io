name: Booklet links (one-off)
on: workflow_dispatch
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o b.pdf https://amcs-community.org/wp-content/uploads/2026/10/moc7-booklet-web-full.pdf
          pip install -q pypdf
          python3 - <<'PY'
          from pypdf import PdfReader
          r=PdfReader("b.pdf")
          for i,p in enumerate(r.pages,1):
              for a in (p.get("/Annots") or []):
                  a=a.get_object(); u=(a.get("/A") or {}).get("/URI")
                  if u and "signal" in str(u).lower(): print("PAGE",i,u)
          PY
