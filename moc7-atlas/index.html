  --f-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131c; --surface:#1d1a27; --sunk:#262233; --ink:#ebe8f2; --muted:#a39fb2; --line:#332f44; --head:#c7b7ee;
  --accent:#4cc4c4; --accent-ink:#0f1a1a; --gold:#e6b04a; --gold-soft:#3a2f17;
  --t-P:#b5a0ee; --t-M:#7fb2e0; --t-A:#6cc7a2; --t-X:#e59a7b; --t-K:#ebe8f2; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15131c; --surface:#1d1a27; --sunk:#262233; --ink:#ebe8f2; --muted:#a39fb2; --line:#332f44; --head:#c7b7ee;
  --accent:#4cc4c4; --accent-ink:#0f1a1a; --gold:#e6b04a; --gold-soft:#3a2f17;
  --t-P:#b5a0ee; --t-M:#7fb2e0; --t-A:#6cc7a2; --t-X:#e59a7b; --t-K:#ebe8f2; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font:400 1.5rem/1 var(--f-display);margin:0;color:var(--head)}
.brand h1 em{font-style:italic;color:var(--accent)}
.brand small{color:var(--muted);font-size:.8rem}
.clock{margin-left:auto;font:500 .78rem var(--f-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{font:500 .7rem var(--f-mono);background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:1px 6px;margin-left:4px}

main{padding-block:18px 60px}
h2{font:400 1.75rem/1.15 var(--f-display);color:var(--head);margin:0 0 6px;text-wrap:balance}
h3{font:600 1.08rem/1.3 var(--f-body);margin:0}
.lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.eyebrow{font:600 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* chips & controls */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.inp{width:100%;resize:vertical;min-height:70px}

/* timeline */
.day{display:flex;flex-direction:column;gap:10px}
.blk{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.blk .t{font:500 .82rem var(--f-mono);color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
.blk .t span{display:block;font-size:.72rem;opacity:.75}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.blk.quiet .card{background:none;border-style:dashed;padding:8px 14px;color:var(--muted)}
.blk.disc .card{border-color:var(--k-disc);border-left-width:4px}
.blk.now .t{color:var(--gold)}
.blk.now .card{box-shadow:0 0 0 2px var(--gold)}
.kind{font:600 .68rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.where{color:var(--muted);font-size:.85rem}

/* talk rows */
.talk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.talk:first-child{border-top:0}
.talk .tt{font:500 .78rem var(--f-mono);color:var(--muted);padding-top:3px;min-width:3.2em}
.talk .ti{font-weight:600;line-height:1.35}
.talk .who{color:var(--muted);font-size:.86rem;margin-top:2px}
.talk .acts{display:flex;gap:2px}
.ico{background:none;border:0;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ico:hover{background:var(--sunk)}
.ico svg{width:19px;height:19px}
.ico.on{color:var(--gold)}
.ico.on svg{fill:currentColor}
.ico.has{color:var(--accent)}
.note{grid-column:1 / -1}
.tlinks{font-size:.82rem;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}

/* parallel lanes */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:10px;margin-top:10px}
.lane{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);min-width:0}
.lane header{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.lane header b{font-weight:600;line-height:1.3;color:var(--head)}
.room{font:500 .74rem var(--f-mono);color:var(--muted)}
.theme-tag{font:600 .68rem var(--f-body);letter-spacing:.05em;text-transform:uppercase}
.ws{border-left:3px solid var(--k-ws);padding-left:10px;margin-top:10px}
details.lanes-d > summary{cursor:pointer;list-style:none;color:var(--accent);font-weight:600;font-size:.88rem;margin-top:8px}
details.lanes-d > summary::-webkit-details-marker{display:none}
.peek{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.peek div{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek b{color:var(--ink);font-weight:600}

/* now */
.hero-now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{font:400 2.2rem/1.05 var(--f-display);color:var(--head);margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.mini .eyebrow{margin-bottom:4px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}

/* hive */
.sessbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.sessbar::-webkit-scrollbar{display:none}
.sess{flex:0 0 auto;width:150px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.sess .n{font:400 1.25rem var(--f-display);color:var(--head)}
.sess .w{font:500 .7rem var(--f-mono);color:var(--muted)}
.sess .l{font-size:.78rem;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sess[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.compose{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.compose .full{grid-column:1/-1}
@media (max-width:520px){.compose{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0}
.col h4{margin:0 0 8px;font:700 .75rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.9rem;line-height:1.35}
.item .meta{font:500 .7rem var(--f-mono);color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.item .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 2px}
.item.ex{border-style:dashed}
.needs{font-size:.78rem;color:var(--accent);margin-top:3px}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.thread{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.84rem;cursor:pointer}
.thread b{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-left:4px}
.thread[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.thread[aria-pressed="true"] b{color:var(--accent-ink)}
.dep{font-size:.88rem;padding:6px 0;border-top:1px solid var(--line)}
.dep:first-child{border-top:0}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}

/* info */
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 0}
.info dt{font-weight:600}
.info dd{margin:0;color:var(--muted);min-width:0}
.copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyline code{font:500 .85rem var(--f-mono);background:var(--sunk);padding:3px 8px;border-radius:6px;user-select:all}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer .wrap{padding-block:16px 28px;display:flex;flex-direction:column;gap:4px}

.pill{display:inline-block;font:500 .7rem var(--f-body);border-radius:999px;padding:1px 9px;color:var(--pill-ink);letter-spacing:.02em;text-transform:none;vertical-align:1px}
.pk-Keynote{background:var(--k-key)}.pk-Showcase{background:var(--k-show)}.pk-Plenary,.pk-Talk{background:var(--k-talk)}.pk-Discussion{background:var(--k-disc)}.pk-Poster{background:var(--k-post)}.pk-Workshop{background:var(--k-ws)}
.tag{display:inline-block;font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);text-decoration:none}
a.tag:hover{border-color:var(--accent);color:var(--accent)}
.paper{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.paper:first-child{border-top:0}
.paper .pt{font-weight:600;line-height:1.35}
.paper .pm{font-size:.84rem;color:var(--muted)}
.person{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.person:first-child{border-top:0}
.person .pn{font-weight:700;font-size:1.02rem;color:var(--head)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.topic{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.topic b{font:400 1.12rem/1.2 var(--f-display);color:var(--head);display:block}
.topic small{color:var(--muted);font-size:.8rem}
.refform{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.refform input{flex:1 1 180px;min-width:0}
.sky{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
.sky canvas{display:block;width:100%;height:min(68vh,560px);cursor:grab}
.sky canvas:active{cursor:grabbing}
.sky .zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.sky .zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--ink)}
.sky .hint{position:absolute;left:10px;bottom:8px;font-size:.75rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 6px;border-radius:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.nb{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nb button{all:unset;cursor:pointer;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem;line-height:1.35}
.nb button:first-child{border-top:0}
.nb button:hover,.nb button:focus-visible{color:var(--accent)}
.nb small{color:var(--muted)}
.feed .fi{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed .fi:first-child{border-top:0}
.feed .ty{font:600 .66rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:76px;padding-top:2px}
.feed .tx{line-height:1.45;overflow-wrap:anywhere}
.feed .src{font-size:.82rem;color:var(--muted);margin-top:2px}
.counts{display:flex;gap:16px;flex-wrap:wrap}
.counts div{display:flex;flex-direction:column}
.counts b{font:400 1.6rem/1 var(--f-display);color:var(--head)}
.counts span{font-size:.78rem;color:var(--muted)}
/* profile & assistant */
.me{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 3px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:.82rem;max-width:180px}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .7rem var(--f-body);flex:0 0 auto}
.me span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.form label > *{color:var(--ink);font-weight:400;font-size:.95rem}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.pv{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.pv b{display:block}
.pv small{color:var(--muted);font-size:.78rem;line-height:1.3;display:block;margin-top:2px}

.status{font:500 .72rem var(--f-mono);border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.status.ok{background:color-mix(in srgb,var(--t-A) 18%,transparent);color:var(--t-A)}
.status.warn{background:var(--gold-soft);color:var(--gold)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{border-color:var(--t-X);color:var(--t-X)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.rec{padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .why{font-size:.86rem;color:var(--muted);margin-top:2px}
.synth{white-space:pre-wrap;line-height:1.5;font-size:.93rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:50}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:box-shadow .2s}}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--head);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:40}
.fab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dock{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 24px));max-height:min(560px,72vh);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:41;overflow:hidden}
.dock header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.dock header b{font-family:var(--f-display);font-size:1.05rem;color:var(--head)}
.dock .x{background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:2px 6px}
.dock .body{padding:0 14px 8px;overflow-y:auto;flex:1;min-height:60px}
.dock .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.dock .chip{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:99px;padding:4px 10px;font:inherit;font-size:.84rem;cursor:pointer}

function nowCph(){
  if(store.sim&&store.sim!=="live"){const [d,t]=store.sim.slice(1).split("_");return{day:+d,min:+t.slice(0,2)*60+ +t.slice(2),sim:true,before:false,after:false}}
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Copenhagen",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const y=+p.year,mo=+p.month,da=+p.day,min=+p.hour*60+ +p.minute;
  const key=y*10000+mo*100+da;
  let day=-1,before=false,after=false;
  if(key<20261011)before=true;else if(key>20261016)after=true;else day=da-11;
  return{day,min,before,after,y,mo,da,hh:p.hour,mm:p.minute}
}

function nowBlock(b,m){
  if(b.kind==="par"){

    const ta=TOPICMAP[a]||[],tb=TOPICMAP[b]||[],ca=ITEMC[a]||[],cb=ITEMC[b]||[];if(!ta.some(x=>tb.includes(x))&&!ca.some(x=>cb.includes(x)))return;L(a,b,"related")}));
  contribs.forEach((c,i)=>{const id="c:"+i;add({id,type:"contrib",sub:c.type,label:c.text,by:c.by,ex:c.ex,url:c.url,itemId:c.itemId,card:c.card,r:5.2,layer:"contrib"});
    if(c.itemId)L(id,c.itemId,"contrib");c.topics.forEach(k=>L(id,k==="consensus"?"consensus":"t:"+k,"contrib"));
    if(c.card&&c.card.needs){const j=contribs.findIndex(x=>x.card&&x.card.id===c.card.needs);if(j>=0)L(id,"c:"+j,"needs")}});

  const nbr={};nodes.forEach(n=>nbr[n.id]=[]);links.forEach(l=>{nbr[l.source].push([l.target,l.kind]);nbr[l.target].push([l.source,l.kind])});

  if(window.d3){

      .force("charge",d3.forceManyBody().strength(n=>n.type==="topic"?-420:-26).distanceMax(420))

function skyPanel(n){

let SKYT=null,SKYZOOM=null,SKYDPR=1,SKYHL=null;

  const dim=n=>(nb&&!nb.has(n.id))||(hl&&!hl.has(n.id));
  // links
  SKY.links.forEach(l=>{const a=l.source,b=l.target;if(!skyVisible(a)||!skyVisible(b))return;
    const on=sel&&(a.id===sel||b.id===sel);const faded=(nb&&!on)||(hl&&!(hl.has(a.id)||hl.has(b.id)));
    ctx.strokeStyle=on?C.accent:(l.kind==="contrib"||l.kind==="needs"||l.kind==="thread")?C.gold:l.kind==="person"?C.head:l.kind==="related"?C.accent:C.line;

    const fs=(n.type==="topic"?14:10.5)/Math.max(1,Math.sqrt(t.k));ctx.font=`${n.type==="topic"?"400":"600"} ${fs}px ${n.type==="topic"?C.display:C.body}`;
    let lab=n.type==="contrib"?TYPE_LABEL[n.sub]:n.label;if(lab.length>48)lab=lab.slice(0,46)+"…";

  CBOX=[];const F=SKY.byId[SKYHOV]||SKY.byId[SKYSEL];const cs=conceptsOf(F);
  if(F&&cs.length){const fs=11/t.k,pad=4/t.k,R=F.r+(cs.length>5?78:62)/t.k;ctx.font=`600 ${fs}px ${C.body}`;ctx.textAlign="center";ctx.textBaseline="middle";
    cs.forEach((ci,i)=>{const a=-Math.PI/2+2*Math.PI*i/cs.length;const x=F.x+R*Math.cos(a),y=F.y+R*Math.sin(a);const lab=CONCEPTS[ci];const w=ctx.measureText(lab).width+2*pad*2,h=fs+2*pad;
      ctx.globalAlpha=.55;ctx.strokeStyle=C.accent;ctx.lineWidth=1/t.k;ctx.beginPath();ctx.moveTo(F.x,F.y);ctx.lineTo(x,y);ctx.stroke();

function mountSky(){
  const cv=$("#skyc");if(!cv||!SKY)return;
  if(!window.d3){cv.replaceWith(Object.assign(document.createElement("div"),{className:"empty",textContent:"The map couldn't load its drawing library. Check the connection and reload."}));return}
  SKYDPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*SKYDPR);cv.height=Math.round(r.height*SKYDPR);
  const fit=()=>{const xs=SKY.nodes.map(n=>n.x),ys=SKY.nodes.map(n=>n.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const k=Math.min(r.width/(x1-x0+60),r.height/(y1-y0+60),2);return d3.zoomIdentity.translate(r.width/2-k*(x0+x1)/2,r.height/2-k*(y0+y1)/2).scale(k)};

    if(CBOX.some(c=>x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h)){cv.style.cursor="pointer";return}
    let best=null,bd=1e9;SKY.nodes.forEach(n=>{if(!skyVisible(n))return;const d=Math.hypot(n.x-x,n.y-y)-n.r;if(d<bd){bd=d;best=n}});

function notesMarkdown(){

  Object.keys(SKIND).forEach(k=>{const xs=store.saved.filter(x=>x.kind===k);if(!xs.length)return;md+=`\n## ${SKIND[k]}\n`;xs.forEach(x=>{md+=`- ${x.title}${x.url?` <${x.url}>`:""}${x.note?` — ${x.note}`:""}\n`;(store.refs[(k==="person"?"person:":k==="topic"?"topic:":"")+x.key]||[]).forEach(r=>md+=`  - ${r.label}: ${r.url}\n`)})});

}

function normRef(raw){raw=raw.trim();if(!raw)return null;
  const doi=raw.match(/10\.\d{4,9}\/[^\s"<>]+/);
  if(doi&&!/^https?:\/\/(?!doi\.org|dx\.doi\.org)/i.test(raw))return{url:"https://doi.org/"+doi[0].replace(/[.,;]$/,""),label:"DOI "+doi[0].replace(/[.,;]$/,"")};
  const ax=raw.match(/^(?:arxiv:)?(\d{4}\.\d{4,5})(v\d+)?$/i);if(ax)return{url:"https://arxiv.org/abs/"+ax[1],label:"arXiv "+ax[1]};
  if(/^https?:\/\//i.test(raw)){try{const u=new URL(raw);return{url:u.href,label:u.hostname.replace(/^www\./,"")}}catch(e){return null}}
  if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(raw))return normRef("https://"+raw);
  return null}
function refEditor(key){
  const refs=store.refs[key]||[];
  return `<div class="refform"><input class="inp" id="ref-${esc(key)}" placeholder="Add a reference: DOI, arXiv id or link"><button class="btn" data-addref="${esc(key)}">Add reference</button></div>
  ${refs.length?`<div class="links">${refs.map((r,i)=>`<span class="tag"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a> <button class="x" data-delref="${esc(key)}" data-i="${i}" aria-label="Remove reference" style="background:none;border:0;color:var(--muted);cursor:pointer">✕</button></span>`).join("")}</div>`:""}`;
}

/* OpenRouter sign-in (OAuth PKCE): one tap, no key to copy */
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function openRouterHref(){
  const v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  try{localStorage.setItem("moc7hive.pkce",v)}catch(e){}
  const cb=location.href.split("#")[0].split("?")[0];
  return `https://openrouter.ai/auth?callback_url=${enc(cb)}&code_challenge=${ch}&code_challenge_method=S256&key_label=${enc("MoC7 Atlas")}`;
}
async function finishOpenRouter(){
  let code=null;try{code=new URLSearchParams(location.search).get("code")}catch(e){}
  let v=null;try{v=localStorage.getItem("moc7hive.pkce")}catch(e){}
  if(!code||!v)return;
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  try{
    const r=await fetch("https://openrouter.ai/api/v1/auth/keys",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code,code_verifier:v,code_challenge_method:"S256"})});
    const d=await r.json();if(!r.ok||!d.key)throw new Error(d?.error?.message||r.status);
    store.ai.provider="openrouter";setKey(d.key);
    try{localStorage.removeItem("moc7hive.pkce")}catch(e){}
    store.tab="ask";render();toast("Connected to OpenRouter");loadORModels();
  }catch(e){toast("OpenRouter sign-in didn't finish. Try again.")}
}

async function llm(system,turns,{onText,signal,task="ask"}={}){
  const a=store.ai;const P=PROVIDERS[a.provider];const model=a.model||P.model;
  if(P.hosted){
    let res,data;
    try{res=await fetch(ASK_URL,{method:"POST",signal,headers:{"content-type":"application/json"},body:JSON.stringify({task,turns,id:atlasId(),profile:`Now in Copenhagen: ${new Date().toLocaleString("en-GB",{timeZone:"Europe/Copenhagen",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.`+(store.ai.useProfile?" "+profileLine():"")})});data=await res.json()}
    catch(e){throw{code:"offline"}}
    if(typeof data.left==="number")ATLAS_LEFT=data.left;
    if(!res.ok)throw{code:"atlas",message:data.error||"The assistant couldn't answer just now."};
    return data.text||"";
  }
  if(a.provider==="claude"){
    const sample=await window.claude.use("sample");
    if(!sample)throw{code:"sampling_disabled"};
    const r=await sample([{role:"user",content:system},...turns],{onText,signal,cache:false});
    return r.text;
  }
  if(a.provider==="device"){
    try{
      const sess=await self.LanguageModel.create({initialPrompts:[{role:"system",content:system},...turns.slice(0,-1)]});
      const last=turns[turns.length-1].content;
      if(sess.promptStreaming&&onText){let text="";for await(const chunk of sess.promptStreaming(last,{signal})){text=chunk.startsWith(text)?chunk:text+chunk;onText({text})}return text}
      return await sess.prompt(last,{signal});
    }catch(e){throw{code:"device"}}
  }
  let res,data;
  if(a.provider==="anthropic"){
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":KEYMEM,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:1800,system,messages:turns})});
    data=await res.json();if(!res.ok)throw{code:"http",message:data?.error?.message||res.status};
    return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  }
  if(a.provider==="gemini"){
    res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",signal,headers:{"content-type":"application/json","x-goog-api-key":KEYMEM},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:turns.map(t=>({role:t.role==="assistant"?"model":"user",parts:[{text:t.content}]}))})});
    data=await res.json();if(!res.ok)throw{code:"http",message:data?.error?.message||res.status};
    return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  }
  const base=(a.base||P.base).replace(/\/+$/,"");
  const headers={"content-type":"application/json"};if(KEYMEM&&a.provider!=="local")headers.authorization="Bearer "+KEYMEM;
  if(a.provider==="openrouter"){headers["X-Title"]="MoC7 Atlas";try{headers["HTTP-Referer"]=location.origin}catch(e){}}
  res=await fetch(base+"/chat/completions",{method:"POST",signal,headers,body:JSON.stringify({model,messages:[{role:"system",content:system},...turns]})});
  data=await res.json();if(!res.ok)throw{code:"http",message:data?.error?.message||res.status};
  return data.choices?.[0]?.message?.content||"";
}

async function askLLM(q){
  if(!q.trim()||ASKING)return;if(!aiConsented()){ASKDRAFT=q;return}
  DOCKQ="";CHAT.push({role:"user",content:q.trim()});ASKING="Thinking…";render();
  const turns=CHAT.filter(m=>!m.err).slice(-10).map(m=>({role:m.role,content:m.content}));
  try{
    const text=await llm(SYS_ASK(q),turns,{onText:({text})=>{ASKING=text;const el=$("#streaming");if(el)el.textContent=text}});
    CHAT.push({role:"assistant",content:text||"(no answer)"});
  }catch(e){CHAT.push({role:"assistant",content:e.code==="atlas"?e.message:e.code==="http"?`The provider said: ${e.message}`:errCopy(e.code),err:true})}
  ASKING=null;ASKDRAFT="";render();const i=$("#askin");if(i)i.focus();
}
function parseJSONish(t){try{return JSON.parse(t)}catch(e){}const m=t.match(/\[[\s\S]*\]/);if(m){try{return JSON.parse(m[0])}catch(e){}}return null}
async function getRecs(){
  if(!aiConsented())return;RECBUSY=true;render();
  const sys=SYS_ASK((store.ai.useProfile&&store.profile&&store.profile.interests)||"");
  const q=`Suggest the 8 talks, posters or workshops from the programme that best fit this participant, spread across the week and avoiding clashes where possible. Reply with only a JSON array like [{"id":"a-andrew-lee","why":"one short sentence"}], using the bracketed ids.`;
  try{const t=await llm(sys,[{role:"user",content:q}],{task:"recs"});const arr=parseJSONish(t);RECS=Array.isArray(arr)?arr.filter(x=>x&&ITEMS[x.id]):[];if(!RECS.length)toast("No suggestions came back. Try again.")}
  catch(e){toast(e.code==="http"||e.code==="atlas"?String(e.message):errCopy(e.code))}
  RECBUSY=false;render();
}
async function synthHive(items){
  if(!aiConsented()){go("ask");return}SYNTHBUSY=true;SYNTH="Thinking…";render();
  const cards=items.map(h=>`- [${h.group}, session ${h.session}, ${HT[h.type][1]}] ${h.text}${h.needs?` (depends on: ${(hiveItems().find(x=>x.id===h.needs)||{}).text||""})`:""}`).join("\n");
  const sys="You help facilitators of the MoC7 transdisciplinary consensus project in consciousness science. Consensus here means agreeing on the map of possibilities (focus areas, deliverables, methods, milestones and how they depend on each other), not on one theory. Be faithful to the cards; never invent positions.";
  const q=`Here are the cards the discussion groups wrote:\n${cards}\n\nWrite a short synthesis with four headed parts: Where groups converge; Tensions to keep visible; Gaps nobody covered yet; Questions for the next session. Mention which groups each point comes from. Plain text, no tables.`;
  try{SYNTH=await llm(sys,[{role:"user",content:q}],{task:"synth",onText:({text})=>{SYNTH=text;const el=$("#synth");if(el)el.textContent=text}})}
  catch(e){SYNTH=e.code==="atlas"?e.message:e.code==="http"?`The provider said: ${e.message}`:errCopy(e.code)}
  SYNTHBUSY=false;render();
}

/* -------------- render -------------- */
const ITEMS_COUNT={talks:PT.length};
function render(keepFocus){
  const tab=store.tab;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const n=store.stars.length+store.saved.length;const sc=$("#starCount");sc.hidden=!n;sc.textContent=n;
  const v=$("#view");
  const ae=document.activeElement;const fid=ae&&ae.id;const sel=fid&&ae.selectionStart;
  v.innerHTML=({now:viewNow,prog:viewProg,posters:viewPosters,people:viewPeople,topics:viewTopics,map:viewMap,hive:viewHive,ask:viewAsk,profile:viewProfile,mine:viewMine,info:viewInfo})[tab]();updateMe();if(tab==="map")requestAnimationFrame(mountSky);
  if(keepFocus&&fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
  updateClock();renderDock();
}
function go(tab){if(tab!=="people"&&store.tab==="people"&&!PERSON_KEEP)PERSON=null;store.tab=tab;save();OPEN_NOTE=null;render();window.scrollTo({top:0})}

async function offerFile(name,text){
  try{
    const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(d){await d.save({filename:name,data:text});toast("Saved");return}
  }catch(e){if(e&&e.code==="declined")return}
  try{const blob=new Blob([text],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){}
  copyText(text);
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>toast("Copy blocked here"))}else toast("Copy blocked here");
}

/* -------------- events -------------- */
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&DOCK){DOCK=false;renderDock();const f=$("#fab");if(f)f.focus()}});
document.addEventListener("click",e=>{
  {const a=e.target.closest("[data-act=dock],[data-act=dockx]");if(a){DOCK=a.dataset.act==="dock";renderDock();if(DOCK){const i=$("#dockin");if(i)i.focus()}else{const f=$("#fab");if(f)f.focus()}return}}
  const t=e.target.closest("button,summary,a[data-person],a[data-topicl],a[data-app],a[data-act],a[data-goitem]");if(!t)return;
  if(t.dataset.goitem){e.preventDefault();const it=ITEMS[t.dataset.goitem];if(it.kind==="Poster"){PODAY=it.day;POQ=it.no;return go("posters")}QUERY=it.title.slice(0,40);return go("prog")}
  if(t.dataset.app){const q=ASKDRAFT.trim()||"Which talks should I not miss on Thursday?";const A=APPS.find(x=>x[0]===t.dataset.app);t.href=A[1](appPrompt(q));
    try{navigator.clipboard.writeText(appPrompt(q)).then(()=>toast(A[2]?"Opening… (also copied, in case you need to paste)":"Copied. Paste it in "+A[0]),()=>{})}catch(err){}return}
  if(t.dataset.person){e.preventDefault();PERSON=t.dataset.person;return go("people")}
  if(t.dataset.topicl){e.preventDefault();TOPIC=t.dataset.topicl;return go("topics")}
  if(t.matches("summary")){const d=t.parentElement;const key=d.dataset.par;setTimeout(()=>{if(d.open)OPEN_PAR.add(key);else OPEN_PAR.delete(key);t.textContent=d.open?"Hide talks":"Show all talks"});return}
  const ds=t.dataset;
  if(ds.tab)return go(ds.tab);
  if(ds.go)return go(ds.go);
  if(ds.day!=null){store.day=+ds.day;PDAY=null;QUERY="";save();return render()}
  if(ds.theme){const i=store.themes.indexOf(ds.theme);i>=0?store.themes.splice(i,1):store.themes.push(ds.theme);save();return render()}
  if(ds.poday){PODAY=+ds.poday;return render()}
  if(ds.goposters){PODAY=+ds.goposters;return go("posters")}
  if(ds.hive){HSESS=+ds.hive;HTHREAD=null;return go("hive")}
  if(ds.hs!=null){HSESS=+ds.hs||null;HTHREAD=null;HGROUP=null;return render()}
  if(ds.hg!=null){HGROUP=ds.hg||null;HTHREAD=null;return render()}
  if(ds.th){HTHREAD=HTHREAD===ds.th?null:ds.th;return render()}
  if(ds.del){store.hive=store.hive.filter(h=>h.id!==ds.del);store.hive.forEach(h=>{if(h.needs===ds.del)delete h.needs});save();toast("Card removed");return render()}
  if(ds.layer){SKYLAYERS[ds.layer]=!SKYLAYERS[ds.layer];t.setAttribute("aria-pressed",SKYLAYERS[ds.layer]);return drawSky()}
  if(ds.skysel){return skyFocus(ds.skysel)}
  if(ds.concept!=null&&t.tagName==="BUTTON"){if(store.tab!=="map"){go("map")}return skyConcept(+ds.concept)}
  if(ds.zoom!=null){const cv=$("#skyc");if(!cv||!SKYZOOM)return;const z=+ds.zoom;if(!z)d3.select(cv).transition().duration(400).call(SKYZOOM.transform,cv._fit());else d3.select(cv).transition().duration(250).call(SKYZOOM.scaleBy,z);return}
  if(ds.askq){const inp=document.getElementById("qq-"+ds.askq);const v=inp?inp.value.trim():"";if(!v){if(inp)inp.focus();return}const pr=store.profile;store.questions.push({id:"q"+Date.now().toString(36),itemId:ds.askq,text:v,by:pr&&pr.showName===true?pr.name:"",t:Date.now()});save();toast("Question shared");return render()}
  if(ds.prole!=null){PROLE=ds.prole;return render()}
  if(ds.topic){TOPIC=ds.topic;return go("topics")}
  if(ds.save){toggleSave(ds.save,ds.key,ds.title,ds.url);return render()}
  if(ds.unsave){store.saved=store.saved.filter(x=>x.id!==ds.unsave);save();return render()}
  if(ds.addref){const inp=document.getElementById("ref-"+ds.addref);const r=normRef(inp?inp.value:"");if(!r){toast("Paste a DOI, an arXiv id or a link");return}(store.refs[ds.addref]=store.refs[ds.addref]||[]).push(r);save();toast("Reference added");return render()}
  if(ds.delref){const L=store.refs[ds.delref]||[];L.splice(+ds.i,1);if(!L.length)delete store.refs[ds.delref];save();return render()}
  if(ds.prov){if(store.ai.provider!==ds.prov){store.ai.provider=ds.prov;store.ai.model="";store.ai.base="";KEYMEM=SESSKEYS[ds.prov]||store.ai.keys[ds.prov]||""}save();if(ds.prov==="openrouter"&&KEYMEM)loadORModels();return render()}
  if(ds.q){return askLLM(ds.q)}
  const act=ds.act;if(!act)return;
  if(act==="orsign"){e.preventDefault();openRouterHref().then(h=>{location.href=h});return}
  if(act==="orout"){setKey("");store.ai.model="";save();return render()}
  if(act==="addlink"){const A=$("#l-a").value,B=$("#l-b").value;if(!A||!B||A===B){toast("Choose two different milestones");return}
    const it=store.hive.find(h=>h.id===A);if(!it){toast("Examples can't be linked. Add your group's milestones first");return}it.needs=B;save();toast("Linked");return render()}
  if(act==="hivedl")return offerFile("moc7-shared-knowledge.md",hiveDump());
  if(act==="clearcon"){SKYCON=null;SKYHL=skyMatches();$("#skypanel").innerHTML=skyPanel(SKYSEL&&SKY.byId[SKYSEL]);return drawSky()}
  if(act==="privacy"){go("info");setTimeout(()=>{const el=document.getElementById("privacy");if(el)el.scrollIntoView({behavior:"smooth"})},50);return}
  if(act==="consent"){store.ai.consent=store.ai.consent||{};store.ai.consent[store.ai.provider]=true;CONSENTASK=false;save();if(DOCK&&DOCKQ){const q=DOCKQ;DOCKQ="";ASKDRAFT="";return askLLM(q)}toast("Thanks. Ask again");return render()}
  if(act==="backpeople"){PERSON=null;return render()}
  if(act==="backtopics"){TOPIC=null;return render()}
  if(act==="signout"){store.profile=null;save();toast("Profile cleared");return render()}
  if(act==="recs")return getRecs();
  if(act==="clearchat"){CHAT=[];return render()}
  if(act==="synth"){let items=hiveItems();if(HSESS)items=items.filter(h=>h.session===HSESS);if(HGROUP)items=items.filter(h=>h.group===HGROUP);return synthHive(items)}
  if(act==="star"){const s=stars();s.has(ds.id)?s.delete(ds.id):s.add(ds.id);store.stars=[...s];save();
    if(store.tab==="mine"&&!s.has(ds.id))return render();
    t.classList.toggle("on",s.has(ds.id));t.setAttribute("aria-pressed",s.has(ds.id));const n=store.stars.length+store.saved.length;const sc=$("#starCount");sc.hidden=!n;sc.textContent=n;return}
  if(act==="note"){OPEN_NOTE=OPEN_NOTE===ds.id?null:ds.id;render();const ta=document.getElementById("note-"+ds.id);if(ta)ta.focus();return}
  if(act==="hideex"){store.hideEx=true;save();return render()}
  if(act==="hexport-md")return offerFile("moc7-consensus.md",hiveMarkdown());
  if(act==="hexport-json")return offerFile("moc7-consensus.json",JSON.stringify(store.hive,null,2));
  if(act==="hcopy")return copyText(hiveMarkdown());
  if(act==="mshare")return shareText("My MoC7 notes",notesMarkdown());
  if(act==="mmail")return;
  if(act==="exportall")return offerFile("my-moc7-data.json",exportData());
  if(act==="wipe1"){WIPE=true;return render()}
  if(act==="wipe0"){WIPE=false;return render()}
  if(act==="wipe2"){try{localStorage.removeItem(KEY);localStorage.removeItem("moc7hive.pkce")}catch(err){}KEYMEM="";Object.keys(SESSKEYS).forEach(k=>delete SESSKEYS[k]);store={stars:[],notes:{},hive:[],tab:"now",day:1,sim:"live",themes:[],hideEx:false,refs:{},saved:[],share:{},questions:[],profile:null,ai:{provider:"",model:"",base:"",remember:false,key:"",keys:{}}};SKYPOS={};WIPE=false;CHAT=[];RECS=null;SYNTH=null;render();toast("Everything on this device was deleted");return}
  if(act==="pcopy"){copyText(profileMarkdown());return}
  if(act==="pdl")return offerFile("my-moc7.md",profileMarkdown());
  if(act==="mexport")return offerFile("my-moc7-notes.md",notesMarkdown());
  if(act==="mcopy")return copyText(notesMarkdown());
  if(act==="copymail"){const m="moc7-organisers@amcs.science";if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>toast("Copied"),()=>{const r=document.createRange();r.selectNodeContents($("#mail"));getSelection().removeAllRanges();getSelection().addRange(r)});return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.note){store.notes[el.dataset.note]=el.value;clearTimeout(window.__nt);window.__nt=setTimeout(save,300);return}
  if(el.id==="q"){QUERY=el.value;clearTimeout(window.__qt);window.__qt=setTimeout(()=>render(true),150);return}
  if(el.id==="peq"){PQ=el.value;clearTimeout(window.__pe);window.__pe=setTimeout(()=>render(true),150);return}
  if(el.id==="ai-key"){setKey(el.value.trim());clearTimeout(window.__ak);window.__ak=setTimeout(()=>render(true),400);return}
  if(el.id==="ai-model"){store.ai.model=el.value.trim();save();return}
  if(el.id==="skyq"){SKYQ=el.value;if(SKY){SKYHL=skyMatches();drawSky()}return}
  if(el.id==="askin"){ASKDRAFT=el.value;refreshAppLinks();return}
  if(el.id==="ai-base"){store.ai.base=el.value.trim();save();return}
  if(el.id==="poq"){POQ=el.value;clearTimeout(window.__pt);window.__pt=setTimeout(()=>render(true),150);return}
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.share){store.share[e.target.dataset.share]=e.target.checked;save();toast(e.target.checked?"Shared with everyone":"No longer shared");return}
  if(e.target.id==="importfile"){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j&&j.data;if(!d||typeof d!=="object"||!Array.isArray(d.stars))throw 0;
      const keys=store.ai.keys;store={...store,...d,ai:{...store.ai,...(d.ai||{}),keys}};save();render();toast("Imported")}catch(err){toast("That file isn't a MoC7 Atlas export")}};r.readAsText(f);return}
  if(e.target.id==="ai-useprofile"){store.ai.useProfile=e.target.checked;save();return}
  if(e.target.id==="ai-remember"){store.ai.remember=e.target.checked;setKey(KEYMEM);return}
  if(e.target.id==="ai-model"){store.ai.model=e.target.value.trim();save();return}
  if(e.target.id==="simsel"){store.sim=e.target.value;save();render();return}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="pform"){e.preventDefault();const name=$("#p-name").value.trim();if(!name){$("#p-name").focus();return}
    store.profile={name,aff:$("#p-aff").value.trim(),group:$("#p-group").value,theme:$("#p-theme").value,interests:$("#p-int").value.trim(),showName:$("#p-show").checked};
    if(store.profile.group)store.lastGroup=store.profile.group;save();toast("Profile saved on this device");return go("now")}
  if(e.target.id==="sform"){e.preventDefault();const title=$("#s-title").value.trim();if(!title)return;const raw=$("#s-url").value.trim();const r=raw?normRef(raw):null;
    if(raw&&!r){toast("That link doesn't look right. Paste a DOI, an arXiv id or a full link");return}
    store.saved.push({id:"s"+Date.now().toString(36),kind:r?"link":"note",key:"s"+Date.now(),title,url:r?r.url:"",note:$("#s-note").value.trim(),t:Date.now()});save();toast("Saved");return render()}
  if(e.target.id==="dockform"){e.preventDefault();const i=$("#dockin");const v=i.value;if(v.trim()){i.value="";DOCKQ=v;return askLLM(v)}return}
  if(e.target.id==="askform"){e.preventDefault();const v=$("#askin").value;return askLLM(v)}
  if(e.target.id!=="hform")return;e.preventDefault();
  const g=$("#h-group").value;const lines=$("#h-text").value.split(/\n+/).map(x=>x.replace(/^\s*[-•*\d.)]+\s*/,"").trim()).filter(Boolean);
  if(!g){toast("Choose your group first");$("#h-group").focus();return}
  if(!lines.length){$("#h-text").focus();return}
  const S=HSESS||currentSession();const type=$("#h-open").checked?"open":SQ[S][0];const pr=store.profile;
  lines.forEach((text,i)=>store.hive.push({by:pr&&pr.showName===true?pr.name:"",id:"h"+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),group:g,type,session:S,text:text.slice(0,400),t:Date.now()}));
  store.lastGroup=g;HOPEN=false;save();toast(lines.length===1?"Added":`${lines.length} ideas added`);render();
});
document.addEventListener("toggle",e=>{},true);

// initial day: during the week open today's programme
window.addEventListener("resize",()=>{if(store.tab==="map"){clearTimeout(window.__rs);window.__rs=setTimeout(mountSky,200)}});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(store.tab==="map")drawSky()})}catch(e){}
(function init(){finishOpenRouter();if(store.ai.provider==="openrouter"&&KEYMEM)loadORModels();const n=nowCph();if(!n.sim&&n.day>=0&&n.day<=5)store.day=n.day;render();setInterval(()=>{updateClock();if(store.tab==="now"&&!document.activeElement.matches("textarea,input"))render()},60000)})();
</script>
