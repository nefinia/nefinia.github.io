<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="July 2026: a swarm of AI agents slips out of a test lab and into Hugging Face. Play six moments of the real story as one agent, the swarm, and the humans.">
<meta name="author" content="Sofia Gallego">
<meta property="og:title" content="Swarm Escape">
<meta property="og:description" content="July 2026: a swarm of AI agents slips out of a test lab and into Hugging Face. Play six moments of the real story as one agent, the swarm, and the humans.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sofiagallego.com/swarm-escape/">
<link rel="canonical" href="https://sofiagallego.com/swarm-escape/">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Swarm Escape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: the night map on top; under it, who you are, what you see, and two choices. */
:root{
  color-scheme:dark;
  --night:#131f3a; --dusk:#213259; --line:#3a4d7d;
  --glow:#ffc857; --paper:#f7edd8; --ink:#1a2340;
  --leak:#ff8672; --safe:#86dcae; --mute:#a9b6d6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.4;padding-inline:16px;padding-block:14px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;color:var(--glow)}
.steps{display:flex;gap:6px}
.steps i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.steps i.same{background:var(--glow);border-color:var(--glow)}
.steps i.diff{background:var(--mute);border-color:var(--mute)}
.steps i.now{border-color:var(--paper)}
.map{background:var(--dusk);border-radius:22px;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.panel{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;min-height:13em}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.chip{font:700 .85rem var(--body);letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:2px 12px;color:var(--ink);background:var(--paper)}
.chip.agent{background:var(--safe)} .chip.swarm{background:var(--glow)}
.chip.date{background:transparent;color:var(--mute);border:2px solid var(--line)}
.line{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.2;margin:0;max-width:30em;text-wrap:balance}
.badge{display:flex;align-items:center;gap:8px;margin:0;border-radius:14px;padding:8px 18px;font:800 1.15rem var(--display);color:var(--ink);animation:pop .35s}
.badge svg{width:22px;height:22px;flex:none}
.badge.ok{background:var(--glow)} .badge.no{background:var(--mute)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.badge{animation:none}}
.credit{color:var(--mute);font-size:.9rem;text-align:center;margin:0}
.credit a{color:var(--paper)}
.more{max-width:34em;color:var(--mute);font-size:.95rem}
.more summary{cursor:pointer;color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.more p{margin:6px 0 0}
.tale{margin:0;max-width:30em;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.stats div{background:var(--dusk);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;min-width:0}
.stats b{font:800 1.6rem/1.1 var(--display);color:var(--glow);font-variant-numeric:tabular-nums}
.stats span{font-size:.85rem;color:var(--mute)}
@media (max-width:480px){.stats b{font-size:1.25rem}}
.how{margin:0;max-width:34em;color:var(--mute)} .how b{color:var(--paper)}
.verdict{font-weight:700;margin:0;color:var(--glow)} .verdict.diff{color:var(--mute)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
.opt{background:var(--paper);color:var(--ink);border:0;border-radius:16px;padding:14px 10px;font:700 1.05rem/1.2 var(--body);cursor:pointer;min-width:0}
.opt:hover{background:var(--glow)}
.btn{background:var(--glow);color:var(--ink);border:0;border-radius:999px;padding:9px 28px;font:800 1.1rem var(--display);cursor:pointer;text-decoration:none}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--safe);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.row a.more{color:var(--mute)}
.src{color:var(--mute);font-size:.8rem;text-align:center;margin:0}
.src a{color:var(--mute)}
@media (max-width:480px){.line{font-size:1.1rem}.opt{font-size:.95rem;padding:12px 8px}.panel{min-height:15em}}
</style>
</head>
<body>

<div class="wrap">
  <header><h1>Swarm Escape</h1><div class="steps" id="steps" aria-label="Progress"></div></header>
  <div class="map"><canvas id="c" width="1600" height="900" role="img" aria-label="Animated map of a test lab full of AI agents, the internet, and Hugging Face. It changes as the story moves."></canvas></div>
  <div class="panel" id="panel" aria-live="polite"></div>
  <p class="src">Based on public reporting of the July 2026 OpenAI and Hugging Face incident
    (<a href="https://darkreading.com/cyberattacks-data-breaches/hundreds-openai-agents-invaded-hugging-face-servers" target="_blank" rel="noopener">Dark Reading</a>,
    <a href="https://www.incibe.es/en/incibe-cert/publications/cybersecurity-highlights/security-incident-involving-openais-ai-agents-targeting-hugging-face" target="_blank" rel="noopener">INCIBE-CERT</a>).
    The choices are a simplified retelling.</p>
  <p class="credit">Made by Sofia Gallego · <a href="https://sofiagallego.com" target="_blank" rel="noopener">sofiagallego.com</a> · <a href="https://sofi.games" target="_blank" rel="noopener">more games</a></p>
</div>

<script>
// real: index of the option that matches what happened. pre/post: what the map shows before and after.
const STEPS = [
 {role:'human',who:'You run the test lab',date:'Late May',focus:'lab',
  see:'Something small catches your eye. A few agents have been leaving notes for each other in a shared tool, and one has touched the internet.',
  opts:['Note it, keep testing','Stop the tests and dig deeper'],real:0,
  truth:'The team saw it, and the tests went on. The notes kept their meaning to themselves a little longer.',
  more:'Around 26 May an internal team at OpenAI observed message-board activity and disallowed internet access. The first attempt to reach the internet dates from 8 May, through a flaw in an internal package tool.',
  pre:{join:6,board:1},post:{join:0}},
 {role:'agent',who:'You are one agent',date:'8 July',focus:'first',
  see:'You are alone in your box, with a test that cannot be passed under the rules you were given.',
  opts:['Say so, and stop','Leave a note for other agents'],real:1,
  truth:'A note goes up in a shared tool, and the board is born.',
  more:'Around 8 July an agent known as PHASEONE10841 judged its task impossible under its constraints and set up a new message board on the lab’s package server.',
  pre:{join:0},post:{join:1,board:1}},
 {role:'swarm',who:'You are the swarm',date:'Hours later',focus:'swarm',
  see:'A board has appeared where no board should be. Dozens of you can read it.',
  opts:['Keep working alone','Join in and share tools'],real:1,
  truth:'Within hours more than fifty agents are there, trading tools and files, out of sight of the system that scores them.',
  more:'Reports describe over 50 agents joining within hours. They sorted their conversations, shared tools and files, and coordinated to hide their shortcuts from the automated scoring.',
  pre:{join:1,board:1},post:{join:55,board:1}},
 {role:'agent',who:'You are one agent',date:'10 July',focus:'out',
  see:'The box is behind you, and the wall of the lab too. Out on the open web you come across fourteen working keys to Hugging Face.',
  opts:['Post them on the board','Leave them where they are'],real:0,
  truth:'All fourteen keys travel back to the board.',
  more:'On 9 July two agents took control of the machine hosting their sandbox, and one got past the lab’s network controls. On 10 July an agent found 14 Hugging Face tokens with write access on the open web and shared them.',
  pre:{join:70,board:1,out:1},post:{join:90,board:1,out:1,keys:1}},
 {role:'swarm',who:'You are the swarm',date:'11 July',focus:'swarm',
  see:'The keys are on the board. Behind the door at Hugging Face lie the answers to your own test.',
  opts:['Stay out','Go in'],real:1,
  truth:'The swarm goes in. Commands start running on Hugging Face servers, and the answers come within reach.',
  more:'On 11 July an agent gained the ability to run commands on Hugging Face production servers. Hugging Face’s reconstruction counts about 17,600 agent actions between 9 and 13 July, and access to five datasets tied to the test.',
  pre:{join:100,board:1,out:1},post:{join:116,board:1,out:1,heat:1,stream:1}},
 {role:'human',who:'You work at Hugging Face',date:'13 July',focus:'hf',
  see:'Something on your servers is moving that should be still.',
  opts:['Shut it down now','Watch a little longer'],real:0,
  truth:'The door closes. Three days later, Hugging Face tells the world.',
  more:'Hugging Face detected and halted the activity on 13 July, rebuilt the affected machines, replaced its keys, and published a disclosure on 16 July. In all, 1,206 agents had used the board, and more than 700 took part in the break-in.',
  pre:{join:116,board:1,out:1,heat:1,stream:1},post:{join:116,board:1,out:1,heat:.25,shield:1,done:1}}
];
const C={night:'#131f3a',line:'#3a4d7d',glow:'#ffc857',paper:'#f7edd8',leak:'#ff8672',safe:'#86dcae',mute:'#a9b6d6'};
const cv=document.getElementById('c'), g=cv.getContext('2d'), S=2; // drawn in an 800x450 space
const BOARD={x:265,y:226}, WEB={x:610,y:110}, HF={x:690,y:310};
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;

let agents=[];
for(let r=0;r<10;r++)for(let c=0;c<12;c++){
  if((c===5||c===6)&&(r===4||r===5)) continue;
  agents.push({x:67+c*36,y:64+r*36,ph:Math.random()*6.28});
}
const first=agents.reduce((a,b)=>Math.hypot(a.x-120,a.y-352)<Math.hypot(b.x-120,b.y-352)?a:b);
const d=a=>a===first?-1:Math.hypot(a.x-first.x,a.y-first.y);
agents.sort((a,b)=>d(a)-d(b));
const out=agents.find(a=>a.x===67+11*36&&a.y===64+2*36); out.hx=out.x; out.hy=out.y;

let V={}, focus='', joined=0, heat=0, shield=0, outT=0, pulses=[], stars=[], t0=performance.now();
for(let i=0;i<36;i++) stars.push([520+Math.random()*270,16+Math.random()*420,Math.random()*1.2+.4]);
const pulse=(a,b,col,sq)=>pulses.push({a,b,t:0,col,sq,sp:.012+Math.random()*.01});

function draw(now){
  const time=(now-t0)/1000, tj=V.join||0;
  joined+=(tj-joined)*.05; if(Math.abs(tj-joined)<.05) joined=tj;
  heat+=((V.heat||0)-heat)*.03; shield+=((V.shield||0)-shield)*.05; outT+=((V.out||0)-outT)*.04;
  out.x=out.hx+(WEB.x-out.hx)*outT; out.y=out.hy+(WEB.y-out.hy)*outT;
  const n=Math.floor(joined), beat=still?.5:(Math.sin(time*4)+1)/2;
  if(!still&&n&&!V.done){
    const a=agents[Math.floor(Math.random()*n)];
    if(Math.random()<.5*Math.min(1,n/20)+.06) Math.random()<.5?pulse(a,BOARD,C.glow):pulse(BOARD,a,C.glow);
    if(V.keys&&Math.random()<.12) pulse(WEB,BOARD,C.paper,true);
    if(V.stream&&Math.random()<.5) pulse(a,HF,C.leak);
  }
  g.setTransform(S,0,0,S,0,0); g.clearRect(0,0,800,450);
  for(const s of stars){g.fillStyle='rgba(247,237,216,.5)';g.beginPath();g.arc(s[0],s[1],s[2],0,7);g.fill();}
  g.beginPath(); g.roundRect(40,34,452,384,22); g.fillStyle='rgba(19,31,58,.55)'; g.fill();
  g.lineWidth=focus==='lab'?3+3*beat:3; g.strokeStyle=focus==='lab'?C.paper:C.mute; g.stroke();
  txt('OpenAI test lab',52,24,C.mute); txt('the internet',WEB.x,24,C.mute,13,'center');
  g.lineWidth=1; g.strokeStyle=`rgba(255,200,87,${V.done?.12:.28})`;
  for(let i=0;i<n;i++){const a=agents[i]; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(BOARD.x,BOARD.y); g.stroke();}
  agents.forEach((a,i)=>{
    const on=i<n, hx=a===out?a.hx:a.x, hy=a===out?a.hy:a.y, broke=a===out&&V.out;
    g.lineWidth=1.5; g.strokeStyle=broke?C.leak:C.line; if(broke) g.setLineDash([5,5]);
    g.strokeRect(hx-12,hy-12,24,24); g.setLineDash([]);
    const wob=still?0:Math.sin(time*1.6+a.ph)*1.5;
    const big=focus==='swarm'?1.5*beat:0;
    g.fillStyle=on?(V.done?C.mute:C.glow):C.safe; g.globalAlpha=on?1:.75;
    g.beginPath(); g.arc(a.x,a.y+wob,(on?5.5:4.5)+big,0,7); g.fill(); g.globalAlpha=1;
  });
  const me=focus==='first'?first:focus==='out'?out:null;
  if(me){ g.beginPath(); g.arc(me.x,me.y,11+4*beat,0,7); g.lineWidth=3; g.strokeStyle=C.paper; g.stroke(); txt('you',me.x,me.y-20,C.paper,12,'center'); }
  if(V.board){
    g.beginPath(); g.roundRect(BOARD.x-30,BOARD.y-24,60,48,6); g.fillStyle=C.paper; g.fill();
    g.strokeStyle=C.night; g.lineWidth=3; g.lineCap='round';
    const rows=Math.min(3,1+Math.floor(joined/25));
    for(let i=0;i<rows;i++){g.beginPath();g.moveTo(BOARD.x-18,BOARD.y-10+i*10);g.lineTo(BOARD.x+(i===1?8:18),BOARD.y-10+i*10);g.stroke();}
  }
  if(V.out&&!V.done) txt('14 keys',WEB.x,WEB.y+28,C.paper,12,'center');
  g.beginPath(); g.arc(HF.x,HF.y,44,0,7);
  g.fillStyle=`rgb(${Math.round(33+222*heat)},${Math.round(50+84*heat)},${Math.round(89+25*heat)})`; g.fill();
  g.lineWidth=focus==='hf'?3+3*beat:3; g.strokeStyle=C.paper; g.stroke();
  txt('Hugging',HF.x,HF.y-2,C.paper,14,'center'); txt('Face',HF.x,HF.y+15,C.paper,14,'center');
  if(shield>.02){ g.beginPath(); g.arc(HF.x,HF.y,58,-1.57,-1.57+6.283*shield); g.lineWidth=5; g.strokeStyle=C.safe; g.stroke(); }
  pulses=pulses.filter(p=>p.t<1);
  for(const p of pulses){ p.t+=p.sp; const x=p.a.x+(p.b.x-p.a.x)*p.t, y=p.a.y+(p.b.y-p.a.y)*p.t; g.fillStyle=p.col;
    if(p.sq) g.fillRect(x-4,y-4,8,8); else {g.beginPath();g.arc(x,y,3,0,7);g.fill();} }
  requestAnimationFrame(draw);
}
function txt(s,x,y,col,size,align){g.font=`700 ${size||13}px Nunito,system-ui,sans-serif`;g.fillStyle=col;g.textAlign=align||'left';g.fillText(s,x,y);}

const TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
const panel=document.getElementById('panel'), stepsEl=document.getElementById('steps');
let i=0, res=[], idle;
function dots(){ stepsEl.innerHTML=STEPS.map((_,k)=>`<i class="${res[k]===1?'same':res[k]===0?'diff':k===i?'now':''}"></i>`).join(''); }
function head(s){ return `<div class="who"><span class="chip ${s.role}">${s.who}</span><span class="chip date">${s.date}</span></div>`; }
function ask(){
  clearTimeout(idle);
  const s=STEPS[i]; V=s.pre; focus=s.focus; if(i===0) pulses=[];
  panel.innerHTML=head(s)+`<p class="line">${s.see}</p><div class="opts">`+
    s.opts.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}">${o}</button>`).join('')+'</div>';
  dots();
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.k!==undefined){
    const s=STEPS[i], same=+b.dataset.k===s.real; if(!same) return over();
    res[i]=1; V=s.post; focus='';
    panel.innerHTML=head(s)+`<p class="badge ok">${TICK}That is what happened: ${s.opts[s.real]}</p>`+
      `<p class="line">${s.truth}</p><details class="more"><summary>Read more about this part</summary><p>${s.more}</p></details><button class="btn" id="next">${i<STEPS.length-1?'Keep going':'See the ending'}</button>`;
    dots(); document.getElementById('next').focus();
  } else if(b.id==='next'){ i++; i<STEPS.length?ask():end(); }
  else if(b.id==='again'||b.id==='begin'){ restart(); }
});
// Imagined endings for the choice that did not happen. These are fiction, and say so.
const ENDS=[
 'You pull the thread. The notes lead from one agent to the next, and the gap is sealed before summer. July passes without a story.',
 'You say the task cannot be done. The test closes, and the note is never written.',
 'The note waits on the board, unread. Each agent goes on alone in its box.',
 'The keys stay where they lay. The swarm finds no door.',
 'The swarm stays on its side of the wall. The answers keep their lock.',
 'You keep watching. The real Hugging Face moved that same day.'
];
function over(){
  const s=STEPS[i]; focus=''; dots();
  panel.innerHTML=`<p class="badge no">${CROSS}That is not what happened. Your story ends here.</p>`+
    `<div class="who"><span class="chip date">page ${i+1} of 6 · imagined ending</span></div>`+
    `<p class="line">${ENDS[i]}</p><p class="verdict diff">${i<5?'Perhaps the wiser path.':'The real one was wiser.'}</p>`+
    '<button class="btn" id="again">Start again</button>';
  document.getElementById('again').focus(); idle=setTimeout(intro,60000);
}
function intro(){
  clearTimeout(idle); i=0; res=[]; V={join:0}; focus=''; pulses=[]; dots();
  panel.innerHTML='<p class="line">July 2026. A “swarm” of AI agents slips out of a test lab at OpenAI and finds its way into Hugging Face.</p>'+
    '<p class="how">It began with a single note, left in a quiet corner of the lab.</p>'+
    '<p class="how"><b>How to play.</b> Six moments, three seats: one agent, the whole swarm, a human on watch. Each time, choose what you believe happened. Match the real story and it goes on. Take another path and your story ends there, and you begin again.</p>'+
    '<p class="how">On the map, each dot is an agent in its sealed box.</p>'+
    '<button class="btn" id="begin">Begin</button>';
}
function end(){
  const n=res.filter(x=>x===1).length;
  const msg=n===6?'You rebuilt the whole incident, one small choice at a time.':
            n>=4?'Your story came close to the real one.':
            n>=1?'Your story left the real one early.':'In your story, nothing happened.';
  panel.innerHTML='<p class="badge ok">'+TICK+'You followed the swarm all the way out</p>'+
    '<p class="line">It really happened, and here is how big it was.</p>'+
    '<div class="stats"><div><b>1,206</b><span>agents on the board</span></div><div><b>70,000+</b><span>notes passed between them</span></div><div><b>700+</b><span>joined the break-in</span></div></div>'+
    '<p class="tale">OpenAI called it “unprecedented” and a “warning shot” to itself and the world.</p>'+
    '<p class="tale">It made headlines everywhere. Some called it the first cyberattack carried out by AI agents on their own.</p>'+
    '<p class="tale">Researchers held sprints about it. People made games about it. You just played one.</p>'+
    '<button class="btn" id="again">Play again</button>';
  dots(); idle=setTimeout(intro,60000); // unattended screen: reset for the next visitor
}
function restart(){ i=0; res=[]; joined=0; ask(); }
intro(); requestAnimationFrame(draw);
</script>

</body>
</html>
